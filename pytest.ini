[pytest]
# Pytest configuration file

# Test discovery patterns
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Test paths
testpaths = src/tests

# Markers for organizing tests
markers =
    unit: Unit tests (fast, no external dependencies)
    integration: Integration tests (may require API keys, use VCR)
    slow: Slow-running tests

# Coverage options (if pytest-cov is installed)
addopts =
    -v
    --tb=short
    --strict-markers
    # Uncomment below to enable coverage reporting
    # --cov=src
    # --cov-report=html
    # --cov-report=term-missing

# Ignore these directories during test collection
norecursedirs = .git .venv venv env __pycache__ *.egg-info dist build

# Show warnings
filterwarnings =
    error::DeprecationWarning
    ignore::DeprecationWarning:vcr.*
